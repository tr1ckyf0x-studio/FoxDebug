# Demo apps for FoxDebug. SPM cannot build an iOS application target, so the two demos live in a
# generated Xcode project instead. Both targets compile the same sources -- the only platform
# difference is inside `DemoRootView` and `ShakeGesture`.
#
#   mint run xcodegen --spec Demo/project.yml
name: FoxDebugDemo

options:
  bundleIdPrefix: com.tr1ckyf0x.foxdebug.demo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FoxDebug:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"

targetTemplates:
  Demo:
    type: application
    sources:
      - Sources
    dependencies:
      - package: FoxDebug
        products:
          - FoxDebugMenu
          - FoxFeatureToggle
          - FoxFeatureToggleUI
          - FoxDebugSettings
          - FoxDebugSettingsUI
          - FoxRemoteConfig
    scheme: {}

targets:
  FoxDebugDemo-iOS:
    templates: [Demo]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.foxdebug.demo.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

  FoxDebugDemo-macOS:
    templates: [Demo]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tr1ckyf0x.foxdebug.demo.macos
